<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
    }

    .price {
      color: #666;
      font-size: 14px;
    }

    input[type="number"] {
      width: 60px;
      padding: 7px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #bill {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px solid #333;
    }

    .bill-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    .message {
      color: #666;
      text-align: center;
    }

    .error {
      color: #b00020;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>☕ Café Bill Calculator</h1>

    <div id="menu">
      <p class="message">Loading menu...</p>
    </div>

    <button id="calculateButton" onclick="calculateBill()" disabled>
      Calculate Bill
    </button>

    <div id="bill"></div>
  </div>

  <script>
    let items = [];

    async function loadMenu() {
      const menu = document.getElementById("menu");
      const calculateButton = document.getElementById("calculateButton");

      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Unable to load menu.csv");
        }

        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);

        // Skip the header row.
        items = lines
          .slice(1)
          .map(line => {
            const [name, price] = line.split(",");

            return {
              name: name.trim(),
              price: parseFloat(price.trim())
            };
          })
          .filter(item =>
            item.name &&
            !Number.isNaN(item.price)
          );

        if (items.length === 0) {
          throw new Error("No valid menu items found.");
        }

        displayMenu();
        calculateButton.disabled = false;

      } catch (error) {
        menu.innerHTML = `
          <p class="error">
            Unable to load the café menu.
          </p>
        `;

        console.error(error);
      }
    }

    function displayMenu() {
      const menu = document.getElementById("menu");

      menu.innerHTML = "";

      items.forEach((item, index) => {
        menu.innerHTML += `
          <div class="item">
            <div class="item-info">
              <div class="item-name">${escapeHTML(item.name)}</div>
              <div class="price">$${item.price.toFixed(2)}</div>
            </div>

            <input
              type="number"
              id="qty-${index}"
              min="0"
              step="1"
              value="0"
              aria-label="Quantity for ${escapeHTML(item.name)}"
            >
          </div>
        `;
      });
    }

    function calculateBill() {
      let total = 0;
      let billHTML = "<h2>Bill</h2>";
      let hasItems = false;

      items.forEach((item, index) => {
        const input = document.getElementById(`qty-${index}`);
        const quantity = Math.max(0, parseInt(input.value) || 0);

        input.value = quantity;

        if (quantity > 0) {
          hasItems = true;

          const subtotal = item.price * quantity;
          total += subtotal;

          billHTML += `
            <div class="bill-row">
              <span>${escapeHTML(item.name)} × ${quantity}</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      if (!hasItems) {
        document.getElementById("bill").innerHTML =
          '<p class="message">Please select at least one item.</p>';
        return;
      }

      billHTML += `
        <div class="bill-row total">
          <span>Total</span>
          <span>$${total.toFixed(2)}</span>
        </div>
      `;

      document.getElementById("bill").innerHTML = billHTML;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadMenu();
  </script>

</body>
</html>
